<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gematria AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(to bottom, #020617, #0f172a, #020617);
      color: #fef3c7;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px 20px 80px;
    }

    h1, h2, h3 {
      font-weight: 300;
    }

    h1 {
      text-align: center;
      color: #fde68a;
      font-size: 40px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #d6a94f;
      letter-spacing: 4px;
      font-size: 12px;
      text-transform: uppercase;
      margin-bottom: 30px;
    }

    .nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 25px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      font-size: 15px;
      background: #92400e;
      color: #fde68a;
    }

    button:hover {
      background: #b45309;
    }

    .nav button {
      background: #0f172a;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .card {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    textarea,
    input,
    select {
      width: 100%;
      border: 1px solid rgba(245, 158, 11, 0.35);
      background: #020617;
      color: white;
      padding: 12px;
      border-radius: 10px;
      margin: 7px 0;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .hidden {
      display: none;
    }

    .cipher-checklist {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      margin: 12px 0;
    }

    .cipher-option {
      padding: 10px;
      background: #020617;
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 10px;
    }

    .cipher-option input {
      width: auto;
    }

    .results-grid {
      display: grid;
      gap: 10px;
      margin-top: 20px;
    }

    .result-row {
      background: #020617;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(245, 158, 11, 0.18);
    }

    .mean-box {
      margin-top: 16px;
      padding: 18px;
      border-radius: 12px;
      background: rgba(146, 64, 14, 0.25);
      border: 1px solid rgba(245, 158, 11, 0.35);
      text-align: center;
    }

    .mean-number {
      font-size: 40px;
      color: #fbbf24;
      margin-top: 6px;
    }

    .letters-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 15px;
    }

    .letter-box {
      background: #020617;
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: 8px;
      padding: 8px;
    }

    .letter-box label {
      display: block;
      font-size: 12px;
      color: #d6a94f;
    }

    .letter-box input {
      margin: 5px 0 0;
      text-align: center;
    }

    .saved-group {
      margin-bottom: 18px;
    }

    .saved-group h3 {
      color: #fbbf24;
      margin-bottom: 8px;
    }

    .saved-item {
      background: #020617;
      border: 1px solid rgba(245, 158, 11, 0.2);
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 10px;
    }

    .small {
      color: #94a3b8;
      font-size: 13px;
    }

    .flex {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .flex button {
      flex: 1;
    }

    @media (max-width: 650px) {
      .nav {
        grid-template-columns: repeat(2, 1fr);
      }

      .letters-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Gematria AI</h1>
  <div class="subtitle">Numbers · Words · Meaning</div>

 <div class="nav">
  <button onclick="showSection('calculator')">Calculator</button>
  <button onclick="showSection('numbers')">Numbers</button>
  <button onclick="showSection('ciphers')">Ciphers</button>
  <button onclick="showSection('saved')">Saved</button>
  <button onclick="showSection('ai')">AI Chat</button>
</div>

  <!-- CALCULATOR -->
  <section id="calculatorSection" class="card">

    <h2>Multi-Cipher Calculator</h2>

    <textarea
      id="textInput"
      placeholder="Enter a word, phrase, or sentence..."
    ></textarea>

    <h3>Select Ciphers</h3>

    <div id="cipherChecklist" class="cipher-checklist"></div>

    <button onclick="calculateAll()">Calculate</button>

    <div id="calculationResults" class="hidden">

      <div id="resultsGrid" class="results-grid"></div>

      <div class="mean-box">
        <div class="small">Mean Value</div>
        <div id="meanValue" class="mean-number">0</div>
      </div>

      <div class="flex" style="margin-top:15px;">
        <button onclick="saveCalculation()">Save Calculation</button>
        <button onclick="discussWithAI()">Discuss With AI</button>
      </div>

    </div>

  </section>
<!-- NUMBERS -->
<section id="numbersSection" class="card hidden">

  <h2>Number Database</h2>

  <p class="small">
    Explore numbers created by your saved cipher calculations and mean values.
  </p>

  <input
    id="numberSearch"
    placeholder="Search for a number..."
    oninput="renderNumbers()"
  />

  <div id="numberDetail" class="hidden"></div>

  <div id="numberList"></div>

</section>
  <!-- CIPHERS -->
  <section id="ciphersSection" class="card hidden">

    <h2>Custom Cipher Manager</h2>

    <input
      id="cipherName"
      placeholder="Cipher name"
    />

    <div id="lettersGrid" class="letters-grid"></div>

    <button onclick="saveCipher()">Save Cipher</button>

    <hr style="border-color:rgba(245,158,11,0.2); margin:25px 0;">

    <h3>Your Ciphers</h3>

    <div id="cipherList"></div>

  </section>

  <!-- SAVED -->
  <section id="savedSection" class="card hidden">

    <h2>Saved Number Database</h2>

    <input
      id="savedSearch"
      placeholder="Search by word or number..."
      oninput="renderSaved()"
    />

    <div id="savedList"></div>

  </section>

  <!-- AI -->
  <section id="aiSection" class="card hidden">

    <h2>AI Discussion</h2>

    <div id="aiContext" class="small">
      Calculate something first.
    </div>

    <textarea
      id="aiQuestion"
      placeholder="Ask about the calculation, pattern, number, or cipher..."
    ></textarea>

    <button onclick="askAI()">Ask AI</button>

    <div id="aiResponse" style="margin-top:20px;"></div>

  </section>

</div>

<script>

const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

let ciphers = JSON.parse(localStorage.getItem("gematriaCiphers")) || [];
let savedCalculations = JSON.parse(localStorage.getItem("gematriaSaved")) || [];

let currentCalculation = null;
let editingCipherId = null;

function saveData() {
  localStorage.setItem("gematriaCiphers", JSON.stringify(ciphers));
  localStorage.setItem("gematriaSaved", JSON.stringify(savedCalculations));
}

function showSection(section) {

const sections = [
  "calculator",
  "numbers",
  "ciphers",
  "saved",
  "ai"
];

  sections.forEach(name => {
    document
      .getElementById(name + "Section")
      .classList
      .add("hidden");
  });

 document
  .getElementById(section + "Section")
  .classList
  .remove("hidden");

if (section === "numbers") {
  renderNumbers();
}
}
}

function createLetterInputs(values = {}) {

  const grid = document.getElementById("lettersGrid");

  grid.innerHTML = "";

  alphabet.forEach(letter => {

    const box = document.createElement("div");

    box.className = "letter-box";

    box.innerHTML = `
      <label>${letter}</label>
      <input
        type="number"
        id="letter_${letter}"
        value="${values[letter] ?? 0}"
      />
    `;

    grid.appendChild(box);
  });
}

function saveCipher() {

  const name = document
    .getElementById("cipherName")
    .value
    .trim();

  if (!name) {
    alert("Enter a cipher name.");
    return;
  }

  const values = {};

  alphabet.forEach(letter => {

    values[letter] =
      Number(
        document.getElementById("letter_" + letter).value
      ) || 0;
  });

  const cipher = {
    id: editingCipherId || Date.now().toString(),
    name,
    values,
    created: new Date().toISOString()
  };

  if (editingCipherId) {

    const index =
      ciphers.findIndex(c => c.id === editingCipherId);

    ciphers[index] = cipher;

  } else {

    ciphers.push(cipher);
  }

  editingCipherId = null;

  document.getElementById("cipherName").value = "";

  createLetterInputs();

  saveData();

  renderCipherList();

  renderCipherChecklist();

  alert("Cipher saved.");
}

function renderCipherList() {

  const list = document.getElementById("cipherList");

  if (!ciphers.length) {

    list.innerHTML =
      '<div class="small">No custom ciphers yet.</div>';

    return;
  }

  list.innerHTML = "";

  ciphers.forEach(cipher => {

    const div = document.createElement("div");

    div.className = "saved-item";

    div.innerHTML = `
      <strong>${cipher.name}</strong>

      <div class="flex" style="margin-top:10px;">
        <button onclick="editCipher('${cipher.id}')">
          Edit
        </button>

        <button onclick="duplicateCipher('${cipher.id}')">
          Duplicate
        </button>

        <button onclick="deleteCipher('${cipher.id}')">
          Delete
        </button>
      </div>
    `;

    list.appendChild(div);
  });
}

function editCipher(id) {

  const cipher = ciphers.find(c => c.id === id);

  if (!cipher) return;

  editingCipherId = id;

  document.getElementById("cipherName").value =
    cipher.name;

  createLetterInputs(cipher.values);

  showSection("ciphers");
}

function duplicateCipher(id) {

  const cipher = ciphers.find(c => c.id === id);

  if (!cipher) return;

  ciphers.push({
    ...cipher,
    id: Date.now().toString(),
    name: cipher.name + " Copy"
  });

  saveData();

  renderCipherList();

  renderCipherChecklist();
}

function deleteCipher(id) {

  if (!confirm("Delete this cipher?")) return;

  ciphers = ciphers.filter(c => c.id !== id);

  saveData();

  renderCipherList();

  renderCipherChecklist();
}

function renderCipherChecklist() {

  const container =
    document.getElementById("cipherChecklist");

  if (!ciphers.length) {

    container.innerHTML =
      '<div class="small">Create at least one cipher in the Ciphers tab first.</div>';

    return;
  }

  container.innerHTML = "";

  ciphers.forEach(cipher => {

    const label = document.createElement("label");

    label.className = "cipher-option";

    label.innerHTML = `
      <input
        type="checkbox"
        class="cipherCheck"
        value="${cipher.id}"
        checked
      >
      ${cipher.name}
    `;

    container.appendChild(label);
  });
}

function calculateUsingCipher(text, cipher) {

  let total = 0;

  const upper = text.toUpperCase();

  for (const char of upper) {

    if (cipher.values[char] !== undefined) {
      total += Number(cipher.values[char]) || 0;
    }
  }

  return total;
}

function calculateAll() {

  const text =
    document.getElementById("textInput")
    .value
    .trim();

  if (!text) {
    alert("Enter a word or phrase.");
    return;
  }

  const selectedIds =
    [...document.querySelectorAll(".cipherCheck:checked")]
    .map(input => input.value);

  if (!selectedIds.length) {
    alert("Select at least one cipher.");
    return;
  }

  const results = [];

  selectedIds.forEach(id => {

    const cipher =
      ciphers.find(c => c.id === id);

    if (!cipher) return;

    const value =
      calculateUsingCipher(text, cipher);

    results.push({
      cipherId: cipher.id,
      cipherName: cipher.name,
      value,
      cipherSnapshot: JSON.parse(JSON.stringify(cipher.values))
    });
  });

  const mean =
    results.reduce((sum, r) => sum + r.value, 0)
    / results.length;

  currentCalculation = {
    id: Date.now().toString(),
    text,
    results,
    mean,
    created: new Date().toISOString()
  };

  renderCurrentCalculation();
}

function renderCurrentCalculation() {

  if (!currentCalculation) return;

  const grid = document.getElementById("resultsGrid");

  grid.innerHTML = "";

  currentCalculation.results.forEach(result => {

    const row = document.createElement("div");

    row.className = "result-row";

    row.innerHTML = `
      <strong>${result.cipherName}</strong>
      <div style="font-size:26px;color:#fbbf24;margin-top:5px;">
        ${result.value}
      </div>
    `;

    grid.appendChild(row);
  });

  document.getElementById("meanValue").textContent =
    formatMean(currentCalculation.mean);

  document
    .getElementById("calculationResults")
    .classList
    .remove("hidden");
}

function formatMean(value) {

  if (Number.isInteger(value)) {
    return value;
  }

  return Number(value.toFixed(4));
}

function saveCalculation() {

  if (!currentCalculation) {
    alert("Calculate something first.");
    return;
  }

  savedCalculations.push(
    JSON.parse(JSON.stringify(currentCalculation))
  );

  saveData();

  renderSaved();

  alert("Calculation saved.");
}

function renderSaved() {

  const container =
    document.getElementById("savedList");

  const search =
    document.getElementById("savedSearch")
    .value
    .toLowerCase()
    .trim();

  if (!savedCalculations.length) {

    container.innerHTML =
      '<div class="small">No saved calculations yet.</div>';

    return;
  }

  const filtered =
    savedCalculations.filter(item => {

      const textMatch =
        item.text.toLowerCase().includes(search);

      const meanMatch =
        String(formatMean(item.mean)).includes(search);

      const cipherMatch =
        item.results.some(r =>
          String(r.value).includes(search)
        );

      return textMatch || meanMatch || cipherMatch;
    });

  container.innerHTML = "";

  filtered.forEach(item => {

    const div = document.createElement("div");

    div.className = "saved-item";

    const resultsHtml =
      item.results
      .map(r =>
        `${r.cipherName}: <strong>${r.value}</strong>`
      )
      .join("<br>");

    div.innerHTML = `
      <strong>${item.text}</strong>

      <div style="margin-top:8px;">
        ${resultsHtml}
      </div>

      <div style="margin-top:8px;color:#fbbf24;">
        Mean: <strong>${formatMean(item.mean)}</strong>
      </div>

      <div class="flex" style="margin-top:10px;">
        <button onclick="loadSaved('${item.id}')">
          Load
        </button>

        <button onclick="deleteSaved('${item.id}')">
          Delete
        </button>
      </div>
    `;

    container.appendChild(div);
  });
}

function loadSaved(id) {

  const item =
    savedCalculations.find(i => i.id === id);

  if (!item) return;

  currentCalculation =
    JSON.parse(JSON.stringify(item));

  document.getElementById("textInput").value =
    item.text;

  renderCurrentCalculation();

  showSection("calculator");
}

function deleteSaved(id) {

  if (!confirm("Delete this saved calculation?")) {
    return;
  }

  savedCalculations =
    savedCalculations.filter(i => i.id !== id);

  saveData();

  renderSaved();
}
function buildNumberDatabase() {

  const database = {};

  function addNumber(value, entry) {

    const key = String(formatMean(value));

    if (!database[key]) {
      database[key] = [];
    }

    database[key].push(entry);
  }

  savedCalculations.forEach(item => {

    item.results.forEach(result => {

      addNumber(result.value, {
        calculationId: item.id,
        text: item.text,
        type: "cipher",
        cipherName: result.cipherName,
        value: result.value,
        mean: item.mean
      });

    });

    addNumber(item.mean, {
      calculationId: item.id,
      text: item.text,
      type: "mean",
      value: item.mean,
      results: item.results
    });

  });

  return database;
}


function renderNumbers() {

  const list =
    document.getElementById("numberList");

  const searchBox =
    document.getElementById("numberSearch");

  if (!list || !searchBox) return;

  const search =
    searchBox.value.trim();

  const database =
    buildNumberDatabase();

  let numbers =
    Object.keys(database);

  numbers.sort((a, b) =>
    Number(a) - Number(b)
  );

  if (search) {

    numbers =
      numbers.filter(number =>
        number.includes(search)
      );
  }

  if (!numbers.length) {

    list.innerHTML =
      '<div class="small">No matching numbers found. Save some calculations first.</div>';

    return;
  }

  list.innerHTML = "";

  numbers.forEach(number => {

    const entries =
      database[number];

    const uniqueWords =
      new Set(
        entries.map(entry =>
          entry.text.toLowerCase()
        )
      ).size;

    const cipherCount =
      entries.filter(
        entry => entry.type === "cipher"
      ).length;

    const meanCount =
      entries.filter(
        entry => entry.type === "mean"
      ).length;

    const box =
      document.createElement("div");

    box.className = "saved-item";

    box.style.cursor = "pointer";

    box.onclick = () =>
      openNumber(number);

    box.innerHTML = `
      <div
        style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          gap:15px;
        "
      >

        <div>

          <div
            style="
              font-size:30px;
              color:#fbbf24;
            "
          >
            ${number}
          </div>

          <div class="small">
            ${uniqueWords} word${uniqueWords === 1 ? "" : "s"} ·
            ${cipherCount} cipher result${cipherCount === 1 ? "" : "s"} ·
            ${meanCount} mean${meanCount === 1 ? "" : "s"}
          </div>

        </div>

        <div style="font-size:22px;">
          →
        </div>

      </div>
    `;

    list.appendChild(box);
  });
}


function openNumber(number) {

  const database =
    buildNumberDatabase();

  const entries =
    database[number] || [];

  const detail =
    document.getElementById("numberDetail");

  const list =
    document.getElementById("numberList");

  detail.classList.remove("hidden");

  list.classList.add("hidden");

  const cipherEntries =
    entries.filter(
      entry => entry.type === "cipher"
    );

  const meanEntries =
    entries.filter(
      entry => entry.type === "mean"
    );

  let html = `
    <button
      onclick="closeNumberDetail()"
      style="
        width:auto;
        margin-bottom:15px;
      "
    >
      ← Back to Numbers
    </button>

    <div class="mean-box">

      <div class="small">
        Number
      </div>

      <div class="mean-number">
        ${number}
      </div>

    </div>
  `;


  if (cipherEntries.length) {

    html += `
      <h3 style="margin-top:25px;">
        Cipher Matches
      </h3>
    `;

    cipherEntries.forEach(entry => {

      html += `
        <div class="saved-item">

          <strong>
            ${escapeHtml(entry.text)}
          </strong>

          <div style="margin-top:8px;">
            ${escapeHtml(entry.cipherName)}
          </div>

          <div
            style="
              margin-top:5px;
              color:#fbbf24;
            "
          >
            Value:
            <strong>${entry.value}</strong>
          </div>

          <div class="small" style="margin-top:5px;">
            Calculation mean:
            ${formatMean(entry.mean)}
          </div>

        </div>
      `;
    });
  }


  if (meanEntries.length) {

    html += `
      <h3 style="margin-top:25px;">
        Mean Matches
      </h3>
    `;

    meanEntries.forEach(entry => {

      const cipherBreakdown =
        entry.results
        .map(result =>
          `${escapeHtml(result.cipherName)}: <strong>${result.value}</strong>`
        )
        .join("<br>");

      html += `
        <div class="saved-item">

          <strong>
            ${escapeHtml(entry.text)}
          </strong>

          <div
            style="
              margin-top:8px;
              color:#fbbf24;
            "
          >
            Mean:
            <strong>
              ${formatMean(entry.value)}
            </strong>
          </div>

          <div class="small" style="margin-top:10px;">
            ${cipherBreakdown}
          </div>

        </div>
      `;
    });
  }


  html += `
    <button
      onclick="discussNumberWithAI('${number}')"
      style="margin-top:20px;"
    >
      Discuss Number ${number} With AI
    </button>
  `;

  detail.innerHTML = html;
}


function closeNumberDetail() {

  const detail =
    document.getElementById("numberDetail");

  const list =
    document.getElementById("numberList");

  detail.classList.add("hidden");

  list.classList.remove("hidden");
}


function discussNumberWithAI(number) {

  const database =
    buildNumberDatabase();

  const entries =
    database[number] || [];

  let context = `
    <strong>Number ${number}</strong>
    <br><br>
  `;

  entries.forEach(entry => {

    if (entry.type === "cipher") {

      context += `
        ${escapeHtml(entry.text)}
        —
        ${escapeHtml(entry.cipherName)}
        =
        ${entry.value}
        <br>
      `;

    } else {

      context += `
        ${escapeHtml(entry.text)}
        —
        Mean =
        ${formatMean(entry.value)}
        <br>
      `;
    }

  });

  document.getElementById(
    "aiContext"
  ).innerHTML = context;

  document.getElementById(
    "aiQuestion"
  ).value =
    `What relationships or patterns can you identify among the saved entries associated with number ${number}?`;

  showSection("ai");
}


function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    String(text);

  return div.innerHTML;
}
function discussWithAI() {

  if (!currentCalculation) return;

  const resultText =
    currentCalculation.results
    .map(r => `${r.cipherName}: ${r.value}`)
    .join("<br>");

  document.getElementById("aiContext").innerHTML = `
    <strong>${currentCalculation.text}</strong>
    <br><br>
    ${resultText}
    <br><br>
    Mean:
    <strong>${formatMean(currentCalculation.mean)}</strong>
  `;

  showSection("ai");
}

function askAI() {

  const question =
    document.getElementById("aiQuestion")
    .value
    .trim();

  if (!question) {
    alert("Enter a question.");
    return;
  }

  document.getElementById("aiResponse").innerHTML = `
    <strong>AI:</strong>
    <br><br>
    The calculator data is ready.
    The next stage will connect this chat to an AI model
    through a secure server endpoint.
  `;
}

createLetterInputs();
renderCipherList();
renderCipherChecklist();
renderSaved();
renderNumbers();

</script>

</body>
</html>
